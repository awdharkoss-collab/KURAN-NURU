name: KURAN-NURU APK Olustur

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: KURAN-NURU Projesini ve Logosunu Olustur
        run: |
          mkdir -p app/src/main/java/com/kurannuru/tilavet
          mkdir -p app/src/main/assets
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
          done

          cp index.html app/src/main/assets/index.html

          python3 -c '
          import zlib, struct, math
          W, H = 512, 512
          img = bytearray(W * H * 4)
          def set_px(x, y, r, g, b, a=255):
              if 0 <= x < W and 0 <= y < H:
                  idx = (y * W + x) * 4
                  img[idx:idx+4] = bytes([r, g, b, a])
          for y in range(H):
              for x in range(W):
                  dist = math.hypot(x - 256, y - 256)
                  t = y / H
                  r = int(7 * (1 - t) + 19 * t)
                  g = int(33 * (1 - t) + 78 * t)
                  b = int(28 * (1 - t) + 61 * t)
                  if 216 <= dist <= 232:
                      r, g, b = 212, 175, 55
                  d_outer = math.hypot(x - 245, y - 256)
                  d_inner = math.hypot(x - 285, y - 256)
                  if d_outer <= 115 and d_inner > 95:
                      r, g, b = 212, 175, 55
                  dx_s, dy_s = abs(x - 335), abs(y - 256)
                  if (dx_s + dy_s <= 36) or (dx_s <= 26 and dy_s <= 26):
                      r, g, b = 245, 208, 70
                  set_px(x, y, r, g, b)
          raw = b"".join(b"\x00" + bytes(img[y*W*4:(y+1)*W*4]) for y in range(H))
          def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          for d in ["mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"]:
              open(f"app/src/main/res/mipmap-{d}/ic_launcher.png", "wb").write(png)
              open(f"app/src/main/res/mipmap-{d}/ic_launcher_round.png", "wb").write(png)
          '

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          python3 -c '
          open("settings.gradle", "w").write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = \"KuranNuru\"\ninclude \":app\"\n")
          open("build.gradle", "w").write("plugins {\n    id \"com.android.application\" version \"8.2.2\" apply false\n    id \"org.jetbrains.kotlin.android\" version \"1.9.22\" apply false\n}\n")
          open("gradle.properties", "w").write("org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n")
          open("app/build.gradle", "w").write("plugins {\n    id \"com.android.application\"\n    id \"org.jetbrains.kotlin.android\"\n}\nandroid {\n    namespace \"com.kurannuru.tilavet\"\n    compileSdk 34\n    defaultConfig {\n        applicationId \"com.kurannuru.tilavet\"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = \"17\" }\n}\n")
          '

          python3 -c '
          import textwrap
          kt = """package com.kurannuru.tilavet

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          """
          open("app/src/main/java/com/kurannuru/tilavet/MainActivity.kt", "w").write(textwrap.dedent(kt))
          '

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: KURAN-NURU-APK
          path: app/build/outputs/apk/debug/*.apk
